name: Build Android APK (VPN)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: |
          mkdir -p src/utils
          echo 'export async function downloadSourceZip() { return true; }' > src/utils/zipDownload.ts
          echo 'export const SOURCE_BUNDLE = {};' > src/utils/sourceBundle.ts
          npm run build

      - name: Setup Capacitor and Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "VPN" "com.vpn.network.app" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPN-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
